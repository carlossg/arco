name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.0
    - run: bun install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
    - run: bun run lint
